name: Ubiquisys
description: 'Ubiquisys was a UK-based developer of intelligent 3G/LTE/Wi-Fi small cells
  and femtocells for mobile operators, with products like ActiveRadio, ActiveSON, CloudBase,
  and EdgeCloud deployed by carriers such as SFR and SoftBank, and was ranked #1 in ABI
  Research''s Small Cell Vendor Matrix. Backed by Accel, Cisco announced its intent to
  acquire Ubiquisys on April 3, 2013, and the company was absorbed into Cisco''s small
  cell portfolio; ubiquisys.com is now Cisco-owned and redirects to Cisco''s acquisitions
  page. Ubiquisys published no public API or developer surface.'
